{{- if .Values.loadBalancer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wildlife-explorer.fullname" . }}-lb
  labels:
    {{- include "wildlife-explorer.labels" . | nindent 4 }}
  {{- with .Values.loadBalancer.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  ports:
    - port: {{ .Values.loadBalancer.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "wildlife-explorer.selectorLabels" . | nindent 4 }}
{{- end }}
