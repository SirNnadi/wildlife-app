{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "wildlife-explorer.fullname" . }}-external-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "wildlife-explorer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ include "wildlife-explorer.fullname" . }}-secret-store
    kind: SecretStore
  target:
    name: {{ .Values.externalSecret.targetSecret }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
